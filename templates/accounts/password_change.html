{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block content %}<div class="page-head"><h1>Change password</h1></div>
{% if request.user.must_change_password %}<div class="callout">You must set a new password before continuing.</div>{% endif %}
<div class="card" style="max-width:560px"><form method="post">{% csrf_token %}{% include "includes/form.html" %}<button class="btn primary">Change password</button></form></div>{% endblock %}
