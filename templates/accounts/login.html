{% extends "accounts/login_base.html" %}
{% block content %}
<form method="post" class="stacked">{% csrf_token %}
  <div class="field"><label for="id_username">Username</label>{{ form.username }}</div>
  <div class="field"><label for="id_password">Password</label>{{ form.password }}</div>
  <button class="btn primary" type="submit" style="width:100%;justify-content:center">Sign in</button>
</form>
{% endblock %}
