# Reverse proxy in front of gunicorn. Replace server_name and certificate paths.
upstream ledgerguard { server 127.0.0.1:8000; }

server {
    listen 80;
    server_name ledgerguard.example.ng;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ledgerguard.example.ng;

    ssl_certificate     /etc/ssl/ledgerguard/fullchain.pem;
    ssl_certificate_key /etc/ssl/ledgerguard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 30m;            # keep in line with LEDGERGUARD_MAX_UPLOAD_MB
    proxy_read_timeout 300s;             # large imports and reconciliations

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://ledgerguard;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
