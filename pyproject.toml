[project]
name = "ledgerguard"
version = "0.1.0"
description = "Banking accounting, reconciliation, audit and financial control platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --reuse-db"
filterwarnings = ["ignore::DeprecationWarning:celery.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "BLE"]
ignore = ["S101", "S105", "S106", "DJ001", "DJ008", "B904", "S308"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]
